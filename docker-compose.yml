version: '3.8'

services:
  api:
    build: .
    container_name: library-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://library_user:library_pass@db:3306/librarydb
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: library-db
    environment:
      MYSQL_DATABASE: librarydb
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - library_data:/var/lib/mysql
      - ./scripts/init_data.sql:/docker-entrypoint-initdb.d/init_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  library_data:
